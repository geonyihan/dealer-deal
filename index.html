<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>무료응모 헌터</title>
<meta name="description" content="구매 없이 참여하는 5,000원 이상 무료 응모·경품만 모아둔 개인용 큐레이션">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%AF%3C/text%3E%3C/svg%3E">
<style>
  :root {
    --bg: #f5f6f8;
    --bg-soft: #ffffff;
    --card: #ffffff;
    --text: #14181f;
    --text-dim: #5b6472;
    --line: #e3e6ec;
    --line-strong: #d3d8e2;
    --accent: #2f6df6;
    --accent-soft: #eaf0ff;
    --hot: #e8503a;
    --hot-soft: #fdeceb;
    --ok: #1d9a6c;
    --shadow: 0 1px 2px rgba(16,24,40,.04), 0 8px 24px rgba(16,24,40,.06);
    --radius: 16px;
  }
  [data-theme="dark"] {
    --bg: #0f1216;
    --bg-soft: #151a21;
    --card: #171c24;
    --text: #eef1f6;
    --text-dim: #9aa4b2;
    --line: #262d38;
    --line-strong: #333c4a;
    --accent: #6f9bff;
    --accent-soft: #1b2740;
    --hot: #ff7a63;
    --hot-soft: #33201d;
    --ok: #45c99a;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 10px 28px rgba(0,0,0,.35);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard",
      "Malgun Gothic", "Noto Sans KR", "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
    line-height: 1.55;
    overflow-wrap: anywhere;
  }
  a { color: inherit; }
  .wrap { width: 100%; max-width: 1180px; margin: 0 auto; padding: 0 16px; }

  /* header */
  header.hero {
    background: linear-gradient(180deg, var(--bg-soft), var(--bg));
    border-bottom: 1px solid var(--line);
    padding: 22px 0 18px;
  }
  .hero-top { display: flex; align-items: flex-start; gap: 12px; }
  .hero h1 {
    margin: 0;
    font-size: clamp(21px, 5.2vw, 30px);
    letter-spacing: -.02em;
    line-height: 1.25;
  }
  .hero h1 .emoji { margin-right: 6px; }
  .hero .sub {
    margin: 6px 0 0;
    color: var(--text-dim);
    font-size: 13.5px;
  }
  .theme-btn {
    margin-left: auto;
    flex: none;
    height: 38px; min-width: 38px;
    border: 1px solid var(--line-strong);
    background: var(--card);
    color: var(--text);
    border-radius: 999px;
    font-size: 16px;
    cursor: pointer;
  }
  .theme-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .stats {
    display: flex; flex-wrap: wrap; gap: 8px 14px;
    margin-top: 14px;
    font-size: 12.5px;
    color: var(--text-dim);
  }
  .stats b { color: var(--text); font-size: 14px; }
  .stats .dot { color: var(--line-strong); }

  /* controls */
  .controls { padding: 16px 0 4px; position: sticky; top: 0; z-index: 5; background: var(--bg); }
  .controls-inner {
    display: flex; flex-direction: column; gap: 10px;
    padding: 12px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
  }
  .search {
    display: flex; align-items: center; gap: 8px;
    border: 1px solid var(--line-strong);
    background: var(--bg-soft);
    border-radius: 999px;
    padding: 0 14px;
    height: 42px;
  }
  .search input {
    flex: 1; min-width: 0;
    border: 0; background: transparent; color: var(--text);
    font: inherit; font-size: 14.5px;
    padding: 0; outline: none;
  }
  .search input::placeholder { color: var(--text-dim); }
  .row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .row-label {
    font-size: 12px; color: var(--text-dim);
    margin-right: 2px; flex: none;
  }
  .chip {
    border: 1px solid var(--line-strong);
    background: var(--bg-soft);
    color: var(--text-dim);
    border-radius: 999px;
    padding: 6px 12px;
    font: inherit; font-size: 13px;
    cursor: pointer;
    white-space: nowrap;
  }
  .chip:hover { border-color: var(--accent); }
  .chip[aria-pressed="true"] {
    background: var(--accent-soft);
    border-color: var(--accent);
    color: var(--accent);
    font-weight: 600;
  }
  .chip:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .hide-row { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text-dim); }
  .hide-row input { width: 16px; height: 16px; accent-color: var(--accent); }

  /* grid */
  main { padding: 14px 0 40px; }
  .grid {
    display: grid;
    gap: 12px;
    grid-template-columns: 1fr;
  }
  @media (min-width: 720px) { .grid { grid-template-columns: 1fr 1fr; gap: 14px; } }
  @media (min-width: 1080px) { .grid { grid-template-columns: 1fr 1fr 1fr; } }

  .card {
    position: relative;
    display: flex; flex-direction: column;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 16px;
    box-shadow: var(--shadow);
  }
  .card.done { opacity: .48; }
  .card.done .title { text-decoration: line-through; text-decoration-thickness: 1px; }
  .card-top { display: flex; align-items: center; gap: 8px; padding-right: 62px; min-height: 24px; }
  .brand {
    font-size: 12.5px; font-weight: 700; letter-spacing: -.01em;
    color: var(--text-dim);
  }
  .badge {
    font-size: 11px; font-weight: 700;
    padding: 2px 8px; border-radius: 999px;
    border: 1px solid transparent;
    white-space: nowrap;
  }
  .badge.insta { background: var(--hot-soft); color: var(--hot); }
  .badge.official { background: var(--accent-soft); color: var(--accent); }
  .badge.form { background: #eef7f1; color: #1d8a5f; }
  .badge.prereg { background: #f4eefd; color: #7a45d1; }
  [data-theme="dark"] .badge.form { background: #152a21; color: #64d2a4; }
  [data-theme="dark"] .badge.prereg { background: #241a36; color: #b596f0; }

  .dday {
    position: absolute; top: 14px; right: 14px;
    font-size: 12px; font-weight: 700;
    padding: 3px 9px; border-radius: 999px;
    background: var(--bg-soft); color: var(--text-dim);
    border: 1px solid var(--line);
    font-variant-numeric: tabular-nums;
  }
  .dday.soon { background: var(--hot-soft); color: var(--hot); border-color: transparent; }
  .dday.any { color: var(--text-dim); }

  .title {
    margin: 10px 0 0;
    font-size: 16.5px;
    line-height: 1.4;
    letter-spacing: -.01em;
  }
  .value {
    margin: 8px 0 0;
    font-size: 13.5px;
    color: var(--text);
    background: var(--bg-soft);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 8px 10px;
  }
  .value .k { color: var(--text-dim); font-size: 12px; margin-right: 4px; }
  .summary {
    margin: 10px 0 0;
    font-size: 13.5px;
    color: var(--text-dim);
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  details.cond { margin-top: 10px; }
  details.cond summary {
    cursor: pointer;
    font-size: 12.5px;
    color: var(--accent);
    list-style: none;
    display: inline-flex; align-items: center; gap: 4px;
  }
  details.cond summary::-webkit-details-marker { display: none; }
  details.cond summary::before { content: "▸"; font-size: 10px; }
  details.cond[open] summary::before { content: "▾"; }
  details.cond .cond-body {
    margin: 8px 0 0;
    font-size: 12.5px;
    color: var(--text-dim);
    border-left: 2px solid var(--line-strong);
    padding-left: 10px;
  }
  .card-foot {
    margin-top: auto;
    padding-top: 14px;
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  }
  .check {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 13px; color: var(--text-dim);
    cursor: pointer;
    user-select: none;
  }
  .check input { width: 17px; height: 17px; accent-color: var(--ok); }
  .go {
    margin-left: auto;
    display: inline-flex; align-items: center; gap: 4px;
    text-decoration: none;
    font-size: 13px; font-weight: 700;
    background: var(--accent);
    color: #fff;
    padding: 9px 13px;
    border-radius: 10px;
    white-space: nowrap;
    word-break: keep-all;
    flex: none;
  }
  .go:hover { filter: brightness(1.06); }
  .go:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .verified { margin-top: 10px; font-size: 11.5px; color: var(--text-dim); }

  .empty {
    margin: 28px 0;
    text-align: center;
    color: var(--text-dim);
    font-size: 14px;
  }
  footer {
    border-top: 1px solid var(--line);
    padding: 18px 0 30px;
    color: var(--text-dim);
    font-size: 12px;
  }
  footer p { margin: 4px 0; }
  .skeleton {
    height: 180px; border-radius: var(--radius);
    background: linear-gradient(90deg, var(--card), var(--bg-soft), var(--card));
    background-size: 200% 100%;
    animation: sk 1.2s linear infinite;
    border: 1px solid var(--line);
  }
  @keyframes sk { to { background-position: -200% 0; } }
  @media (prefers-reduced-motion: reduce) { .skeleton { animation: none; } }
</style>
</head>
<body>
<header class="hero">
  <div class="wrap">
    <div class="hero-top">
      <div>
        <h1><span class="emoji" aria-hidden="true">🎯</span>무료응모 헌터</h1>
        <p class="sub">구매 없이 참여하는 <b>5,000원 이상</b> 무료 응모만 모았습니다</p>
      </div>
      <button id="themeBtn" class="theme-btn" type="button" aria-label="다크 모드 전환" title="다크 모드 전환">🌙</button>
    </div>
    <div class="stats">
      <span>진행 중 <b id="countNow">–</b>건</span>
      <span class="dot">·</span>
      <span>마감 임박(3일 내) <b id="countSoon">–</b>건</span>
      <span class="dot">·</span>
      <span>업데이트 <b id="updated">–</b></span>
      <span class="dot">·</span>
      <span>응모 완료 <b id="countDone">0</b>건</span>
    </div>
  </div>
</header>

<main>
  <div class="wrap">
    <section class="controls" aria-label="검색과 필터">
      <div class="controls-inner">
        <label class="search">
          <span aria-hidden="true">🔍</span>
          <input id="q" type="search" placeholder="브랜드·경품·키워드 검색 (예: 갤럭시, 상품권, 사전예약)" autocomplete="off">
        </label>
        <div class="row" id="catRow" role="group" aria-label="응모 방식 필터">
          <span class="row-label">응모 방식</span>
          <button class="chip" type="button" data-cat="all" aria-pressed="true">전체</button>
          <button class="chip" type="button" data-cat="insta" aria-pressed="false">인스타</button>
          <button class="chip" type="button" data-cat="official" aria-pressed="false">공식몰·폼</button>
          <button class="chip" type="button" data-cat="prereg" aria-pressed="false">사전예약</button>
        </div>
        <div class="row" id="sortRow" role="group" aria-label="정렬">
          <span class="row-label">정렬</span>
          <button class="chip" type="button" data-sort="deadline" aria-pressed="true">마감임박순</button>
          <button class="chip" type="button" data-sort="new" aria-pressed="false">최신순</button>
        </div>
        <div class="hide-row">
          <input id="hideDone" type="checkbox">
          <label for="hideDone">응모 완료한 건 숨기기</label>
        </div>
      </div>
    </section>

    <section id="list" class="grid" aria-live="polite"></section>
    <p id="empty" class="empty" hidden>조건에 맞는 응모가 없습니다. 검색어나 필터를 바꿔 보세요.</p>
    <p id="error" class="empty" hidden>데이터를 불러오지 못했습니다. 잠시 후 새로고침해 주세요.</p>
  </div>
</main>

<footer>
  <div class="wrap">
    <p>모든 항목은 공식 페이지에서 직접 열어 확인한 것만 실었습니다. 응모 전 마감일·조건은 공식 페이지에서 한 번 더 확인하세요.</p>
    <p>응모 완료 체크는 이 브라우저(localStorage)에만 저장됩니다.</p>
  </div>
</footer>

<script>
(function () {
  "use strict";

  var LS_DONE = "dealHunter.done.v1";
  var LS_THEME = "dealHunter.theme.v1";
  var LS_CAT = "dealHunter.cat.v1";
  var LS_SORT = "dealHunter.sort.v1";
  var LS_HIDE = "dealHunter.hideDone.v1";

  var CAT_LABEL = { insta: "인스타", official: "공식", form: "폼", prereg: "사전예약" };

  var state = {
    events: [],
    updated: "",
    q: "",
    cat: "all",
    sort: "deadline",
    hideDone: false,
    done: {}
  };

  /* ---------- storage ---------- */
  function readJSON(key, fallback) {
    try {
      var raw = localStorage.getItem(key);
      return raw ? JSON.parse(raw) : fallback;
    } catch (e) { return fallback; }
  }
  function writeJSON(key, value) {
    try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) { /* private mode */ }
  }

  /* ---------- date helpers (KST) ---------- */
  function todayKST() {
    var now = new Date();
    var kst = new Date(now.getTime() + (9 * 60 + now.getTimezoneOffset()) * 60000);
    return new Date(kst.getFullYear(), kst.getMonth(), kst.getDate());
  }
  function parseDate(s) {
    if (!s || !/^\d{4}-\d{2}-\d{2}$/.test(s)) return null;
    var p = s.split("-");
    return new Date(+p[0], +p[1] - 1, +p[2]);
  }
  function daysLeft(ev) {
    var d = parseDate(ev.deadline);
    if (!d) return null;
    return Math.round((d - todayKST()) / 86400000);
  }
  function ddayText(ev) {
    var d = daysLeft(ev);
    if (d === null) return { text: ev.deadline || "상시", cls: "any" };
    if (d < 0) return { text: "마감", cls: "any" };
    if (d === 0) return { text: "D-DAY", cls: "soon" };
    return { text: "D-" + d, cls: d <= 3 ? "soon" : "" };
  }

  /* ---------- render ---------- */
  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }

  function categoryMatch(ev) {
    if (state.cat === "all") return true;
    if (state.cat === "official") return ev.category === "official" || ev.category === "form";
    return ev.category === state.cat;
  }
  function searchMatch(ev) {
    if (!state.q) return true;
    var hay = [ev.brand, ev.title, ev.value_note, ev.summary, ev.conditions, ev.category]
      .join(" ").toLowerCase();
    return state.q.toLowerCase().split(/\s+/).filter(Boolean).every(function (t) {
      return hay.indexOf(t) !== -1;
    });
  }

  function visibleEvents() {
    var list = state.events.filter(function (ev) {
      if (daysLeft(ev) !== null && daysLeft(ev) < 0) return false;
      if (!categoryMatch(ev)) return false;
      if (!searchMatch(ev)) return false;
      if (state.hideDone && state.done[ev.id]) return false;
      return true;
    });
    list.sort(function (a, b) {
      if (state.sort === "new") {
        return String(b.start || b.verified_at || "").localeCompare(String(a.start || a.verified_at || ""));
      }
      var da = daysLeft(a), db = daysLeft(b);
      var ka = da === null ? 9999 : da, kb = db === null ? 9999 : db;
      if (ka !== kb) return ka - kb;
      return String(a.brand).localeCompare(String(b.brand));
    });
    return list;
  }

  function card(ev) {
    var art = el("article", "card" + (state.done[ev.id] ? " done" : ""));
    art.setAttribute("data-id", ev.id);

    var top = el("div", "card-top");
    top.appendChild(el("span", "brand", ev.brand));
    top.appendChild(el("span", "badge " + ev.category, CAT_LABEL[ev.category] || ev.category));
    art.appendChild(top);

    var dd = ddayText(ev);
    var dday = el("span", "dday " + dd.cls, dd.text);
    if (ev.deadline && /^\d{4}-/.test(ev.deadline)) dday.title = "마감 " + ev.deadline;
    art.appendChild(dday);

    art.appendChild(el("h2", "title", ev.title));

    var value = el("p", "value");
    value.appendChild(el("span", "k", "경품"));
    value.appendChild(document.createTextNode(ev.value_note));
    art.appendChild(value);

    art.appendChild(el("p", "summary", ev.summary));

    if (ev.conditions) {
      var det = el("details", "cond");
      det.appendChild(el("summary", null, "참여 조건"));
      det.appendChild(el("p", "cond-body", ev.conditions));
      art.appendChild(det);
    }

    var foot = el("div", "card-foot");
    var lab = el("label", "check");
    var cb = document.createElement("input");
    cb.type = "checkbox";
    cb.checked = !!state.done[ev.id];
    cb.setAttribute("aria-label", ev.title + " 응모 완료 표시");
    cb.addEventListener("change", function () {
      if (cb.checked) state.done[ev.id] = true; else delete state.done[ev.id];
      writeJSON(LS_DONE, state.done);
      art.classList.toggle("done", cb.checked);
      updateCounts();
      if (state.hideDone && cb.checked) render();
    });
    lab.appendChild(cb);
    lab.appendChild(document.createTextNode("응모 완료"));
    foot.appendChild(lab);

    var go = el("a", "go", "공식 페이지 ↗");
    go.setAttribute("aria-label", ev.title + " 공식 페이지에서 참여");
    go.title = "공식 페이지에서 참여";
    go.href = ev.url;
    go.target = "_blank";
    go.rel = "noopener noreferrer";
    foot.appendChild(go);
    art.appendChild(foot);

    if (ev.verified_at) art.appendChild(el("p", "verified", "링크·마감 확인 " + ev.verified_at));
    return art;
  }

  function render() {
    var list = visibleEvents();
    var wrap = document.getElementById("list");
    wrap.textContent = "";
    var frag = document.createDocumentFragment();
    list.forEach(function (ev) { frag.appendChild(card(ev)); });
    wrap.appendChild(frag);
    document.getElementById("empty").hidden = list.length !== 0;
  }

  function updateCounts() {
    var now = state.events.filter(function (ev) {
      var d = daysLeft(ev);
      return d === null || d >= 0;
    });
    document.getElementById("countNow").textContent = now.length;
    document.getElementById("countSoon").textContent = now.filter(function (ev) {
      var d = daysLeft(ev);
      return d !== null && d <= 3;
    }).length;
    document.getElementById("countDone").textContent = Object.keys(state.done).length;
  }

  /* ---------- controls ---------- */
  function setCat(cat) {
    state.cat = cat;
    writeJSON(LS_CAT, cat);
    [].forEach.call(document.querySelectorAll("#catRow .chip"), function (b) {
      b.setAttribute("aria-pressed", String(b.dataset.cat === cat));
    });
    render();
  }
  function setSort(sort) {
    state.sort = sort;
    writeJSON(LS_SORT, sort);
    [].forEach.call(document.querySelectorAll("#sortRow .chip"), function (b) {
      b.setAttribute("aria-pressed", String(b.dataset.sort === sort));
    });
    render();
  }

  function applyTheme(theme) {
    document.documentElement.setAttribute("data-theme", theme);
    var btn = document.getElementById("themeBtn");
    btn.textContent = theme === "dark" ? "☀️" : "🌙";
    btn.setAttribute("aria-label", theme === "dark" ? "라이트 모드로 전환" : "다크 모드로 전환");
    btn.title = btn.getAttribute("aria-label");
  }

  function initTheme() {
    var saved = null;
    try { saved = localStorage.getItem(LS_THEME); } catch (e) {}
    var prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
    applyTheme(saved || (prefersDark ? "dark" : "light"));
  }

  function bind() {
    document.getElementById("q").addEventListener("input", function (e) {
      state.q = e.target.value.trim();
      render();
    });
    [].forEach.call(document.querySelectorAll("#catRow .chip"), function (b) {
      b.addEventListener("click", function () { setCat(b.dataset.cat); });
    });
    [].forEach.call(document.querySelectorAll("#sortRow .chip"), function (b) {
      b.addEventListener("click", function () { setSort(b.dataset.sort); });
    });
    var hide = document.getElementById("hideDone");
    hide.checked = state.hideDone;
    hide.addEventListener("change", function () {
      state.hideDone = hide.checked;
      writeJSON(LS_HIDE, state.hideDone);
      render();
    });
    document.getElementById("themeBtn").addEventListener("click", function () {
      var next = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
      applyTheme(next);
      try { localStorage.setItem(LS_THEME, next); } catch (e) {}
    });
  }

  /* ---------- boot ---------- */
  function boot() {
    initTheme();
    state.done = readJSON(LS_DONE, {}) || {};
    state.cat = readJSON(LS_CAT, "all") || "all";
    state.sort = readJSON(LS_SORT, "deadline") || "deadline";
    state.hideDone = !!readJSON(LS_HIDE, false);
    bind();
    setCat(state.cat);
    setSort(state.sort);
    document.getElementById("hideDone").checked = state.hideDone;

    var grid = document.getElementById("list");
    for (var i = 0; i < 3; i++) grid.appendChild(el("div", "skeleton"));

    fetch("./data/events.json", { cache: "no-cache" })
      .then(function (r) {
        if (!r.ok) throw new Error("HTTP " + r.status);
        return r.json();
      })
      .then(function (data) {
        state.events = (data.events || []).slice();
        state.updated = data.updated_label || (data.updated || "").slice(0, 10) || "";
        document.getElementById("updated").textContent = state.updated || "–";
        updateCounts();
        render();
      })
      .catch(function (err) {
        grid.textContent = "";
        document.getElementById("error").hidden = false;
        if (window.console) console.error("events.json load failed:", err);
      });
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", boot);
  } else {
    boot();
  }
})();
</script>
</body>
</html>
