<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>무료응모 헌터 · AI 콘테스트 · 지원금</title>
<meta name="description" content="구매 없이 참여하는 무료응모, 접수 중인 AI 콘테스트·경진대회, 받을 수 있는 지원금·AI 혜택을 한곳에 모은 개인용 큐레이션">
<link rel="icon" href="./images/avatar.png">
<style>
  :root {
    --bg: #ffffff;
    --bg-soft: #faf9f7;
    --ink: #14120f;
    --text: #1d1b18;
    --body: #46423c;
    --dim: #8a857d;
    --line: #e8e5df;
    --line-strong: #d8d4cc;
    --chip: #f5f3ef;
    --accent: #b4471f;
    --accent-soft: #fbf0ea;
    --thumb-bg: #f6f4f0;
    --ok: #2f7d57;
    --ok-soft: #edf5f0;
    --ok-line: #b7d8c6;
    --radius: 12px;
  }
  html[data-theme="dark"] {
    --bg: #101010;
    --bg-soft: #171717;
    --ink: #f3f1ed;
    --text: #e9e6e1;
    --body: #b7b2aa;
    --dim: #8b867e;
    --line: #262524;
    --line-strong: #353331;
    --chip: #1b1a19;
    --accent: #e2835a;
    --accent-soft: #2a1c15;
    --thumb-bg: #1c1b19;
    --ok: #6bbf92;
    --ok-soft: #17251d;
    --ok-line: #2f5341;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard",
      "Malgun Gothic", "Noto Sans KR", "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
    line-height: 1.55;
    overflow-wrap: anywhere;
    word-break: keep-all;
  }
  a { color: inherit; }
  .wrap { width: 100%; max-width: 560px; margin: 0 auto; padding: 0 20px; }
  [hidden] { display: none !important; }

  /* ---------- header ---------- */
  .site-head { padding: 30px 0 0; }
  .site-head .bar { display: flex; align-items: center; gap: 12px; }
  .avatar {
    width: 46px; height: 46px; flex: none;
    border-radius: 50%; object-fit: cover;
    border: 1px solid var(--line);
    background: #fff;
  }
  .brand-text { min-width: 0; }
  .brand-text h1 {
    margin: 0;
    font-size: 22px;
    line-height: 1.2;
    letter-spacing: -.03em;
    font-weight: 800;
    color: var(--ink);
  }
  .brand-text .tagline {
    margin: 3px 0 0;
    font-size: 12.5px;
    color: var(--dim);
    letter-spacing: -.01em;
  }
  .theme-btn {
    margin-left: auto; flex: none;
    width: 30px; height: 30px;
    display: inline-flex; align-items: center; justify-content: center;
    background: transparent; color: var(--dim);
    border: 1px solid transparent; border-radius: 50%;
    cursor: pointer; padding: 0;
  }
  .theme-btn:hover { color: var(--ink); background: var(--chip); }
  .theme-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .theme-btn svg { width: 17px; height: 17px; display: block; }

  /* ---------- top tabs ---------- */
  .tabs {
    display: flex; gap: 4px;
    margin-top: 16px;
    padding: 3px;
    background: var(--chip);
    border: 1px solid var(--line);
    border-radius: 12px;
  }
  .tab {
    flex: 1 1 0; min-width: 0;
    display: inline-flex; align-items: center; justify-content: center; gap: 4px;
    font: inherit; font-size: 12px; font-weight: 700;
    letter-spacing: -.03em;
    color: var(--dim);
    background: transparent;
    border: 1px solid transparent;
    border-radius: 9px;
    padding: 7px 3px;
    cursor: pointer;
    white-space: nowrap;
    transition: color .12s, background .12s, border-color .12s;
  }
  .tab .t-ico { font-size: 13px; line-height: 1; flex: none; }
  .tab .t-label { overflow: hidden; text-overflow: ellipsis; }
  .tab .t-c {
    flex: none;
    font-size: 9.5px; font-weight: 700; line-height: 1.6;
    min-width: 14px; padding: 0 3px;
    border-radius: 999px;
    text-align: center;
    font-variant-numeric: tabular-nums;
    color: var(--dim);
    background: var(--bg);
  }
  @media (max-width: 430px) {
    .tabs { margin-left: -7px; margin-right: -7px; }
    .tab { font-size: 10.8px; padding: 7px 2px; gap: 3px; letter-spacing: -.045em; }
    .tab .t-ico { font-size: 11.5px; }
    .tab .t-c { font-size: 9px; min-width: 13px; padding: 0 3px; }
  }
  .tab:hover { color: var(--ink); }
  .tab[aria-selected="true"] {
    color: var(--ink);
    background: var(--bg);
    border-color: var(--line);
    box-shadow: 0 1px 2px rgba(0,0,0,.04);
  }
  .tab[aria-selected="true"] .t-c { color: var(--bg); background: var(--ink); }
  .tab:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

  /* ---------- toolbar ---------- */
  .toolbar {
    position: sticky; top: 0; z-index: 6;
    background: var(--bg);
    padding: 14px 0 8px;
  }
  .search {
    display: flex; align-items: center; gap: 7px;
    height: 34px; padding: 0 11px;
    background: var(--chip);
    border: 1px solid transparent;
    border-radius: 9px;
  }
  .search:focus-within { border-color: var(--line-strong); background: var(--bg); }
  .search svg { width: 14px; height: 14px; flex: none; color: var(--dim); }
  .search input {
    flex: 1; min-width: 0;
    border: 0; background: transparent; color: var(--text);
    font: inherit; font-size: 13px; padding: 0; outline: none;
  }
  .search input::placeholder { color: var(--dim); }
  .chiprow {
    display: flex; align-items: center; flex-wrap: wrap; gap: 4px;
    margin-top: 8px;
  }
  .chiprow::-webkit-scrollbar { display: none; }
  .sortgroup { display: inline-flex; align-items: center; gap: 5px; flex: none; }
  .sortrow {
    display: flex; align-items: center; justify-content: flex-end; gap: 5px;
    margin-top: 6px;
  }
  .sortlabel { font-size: 11px; color: var(--dim); letter-spacing: -.01em; flex: none; }
  .sortsep {
    flex: none; width: 1px; height: 14px;
    background: var(--line-strong); margin: 0 3px 0 6px;
  }
  .prizerow {
    display: flex; align-items: center; flex-wrap: wrap; gap: 5px;
    margin-top: 8px;
  }
  .prizerow::-webkit-scrollbar { display: none; }
  .chip.pz { display: inline-flex; align-items: center; gap: 4px; }
  .chip.pz .pz-ico { font-size: 12px; line-height: 1; }
  .chip.pz .pz-c {
    font-size: 10px; font-weight: 700;
    line-height: 1.5;
    min-width: 16px; padding: 0 4px;
    border-radius: 999px;
    text-align: center;
    font-variant-numeric: tabular-nums;
    color: var(--dim);
    background: var(--chip);
  }
  .chip.pz[aria-pressed="true"] .pz-c { color: var(--bg); background: var(--ink); }
  .chip.pz[aria-pressed="true"] .pz-ico { opacity: 1; }
  #enteredOnly .pz-c, #contestsChecked .pz-c, #benefitsChecked .pz-c {
    font-size: 10px; font-weight: 700; line-height: 1.5;
    min-width: 16px; padding: 0 4px; border-radius: 999px; text-align: center;
    font-variant-numeric: tabular-nums; color: var(--dim); background: var(--chip);
  }
  #enteredOnly[aria-pressed="true"], #contestsChecked[aria-pressed="true"], #benefitsChecked[aria-pressed="true"] {
    color: var(--ok); border-color: var(--ok); background: var(--ok-soft); font-weight: 700;
  }
  #enteredOnly[aria-pressed="true"] .pz-c, #contestsChecked[aria-pressed="true"] .pz-c,
  #benefitsChecked[aria-pressed="true"] .pz-c { color: var(--bg); background: var(--ok); }
  @media (max-width: 600px) {
    .prizerow, .chiprow {
      flex-wrap: nowrap;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      padding-bottom: 1px;
    }
    .chip { font-size: 12px; padding: 4px 10px; }
    .chip.pz { padding: 4px 9px; }
    .sortrow { margin-top: 6px; }
  }
  /* 넓은 화면에서는 칩이 두 줄로 늘어나므로 필터 바를 고정하지 않는다 */
  @media (min-width: 601px) {
    .toolbar { position: static; }
  }
  .chip {
    flex: none;
    font: inherit; font-size: 12px;
    color: var(--dim);
    background: transparent;
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 4px 9px;
    cursor: pointer;
    white-space: nowrap;
    letter-spacing: -.01em;
    transition: color .12s, border-color .12s, background .12s;
  }
  .chip:hover { color: var(--ink); border-color: var(--line-strong); }
  .chip[aria-pressed="true"] {
    color: var(--ink);
    background: var(--chip);
    border-color: var(--ink);
    font-weight: 600;
  }
  .chip:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .chip.sort[aria-pressed="true"] { border-color: transparent; color: var(--ink); font-weight: 600; }
  .chip .c-cnt {
    font-size: 10px; font-weight: 700; line-height: 1.5;
    min-width: 16px; padding: 0 4px; margin-left: 3px;
    border-radius: 999px; text-align: center;
    font-variant-numeric: tabular-nums;
    color: var(--dim); background: var(--chip);
  }
  .chip[aria-pressed="true"] .c-cnt { color: var(--bg); background: var(--ink); }

  /* ---------- list head ---------- */
  .list-head {
    display: flex; align-items: baseline; justify-content: space-between; gap: 10px;
    margin-top: 18px;
    padding-bottom: 9px;
    border-bottom: 2px solid var(--ink);
  }
  .list-head h2 {
    margin: 0;
    font-size: 17px;
    font-weight: 800;
    letter-spacing: -.03em;
    color: var(--ink);
  }
  .list-head h2 .num { font-weight: 700; color: var(--dim); font-size: 15px; }
  .list-head .stamp { font-size: 12px; color: var(--dim); letter-spacing: -.01em; white-space: nowrap; }

  /* ---------- rows ---------- */
  .feed { margin: 0; padding: 0; }
  .row {
    display: block;
    padding: 22px 0 20px;
    border-bottom: 1px solid var(--line);
  }
  .row.entered { background: linear-gradient(90deg, var(--ok-soft), rgba(0,0,0,0) 78%); }
  .row.entered .thumb { box-shadow: 0 0 0 1px var(--ok-line); }
  .row-top { display: flex; gap: 14px; align-items: flex-start; }
  .row-text { flex: 1; min-width: 0; }
  .brandline { display: flex; align-items: center; flex-wrap: wrap; gap: 4px 6px; }
  .favicon {
    width: 14px; height: 14px; flex: none;
    border-radius: 3px;
    object-fit: contain;
    background: var(--thumb-bg);
  }
  .brand {
    font-size: 12px; color: var(--dim); letter-spacing: -.01em;
    min-width: 0; max-width: 100%;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .chan {
    flex: none;
    font-size: 10.5px;
    font-weight: 600;
    line-height: 1.65;
    letter-spacing: -.01em;
    color: var(--body);
    background: var(--chip);
    border-radius: 4px;
    padding: 0 5px;
    white-space: nowrap;
  }
  html[data-theme="dark"] .chan { color: var(--text); }
  .title {
    margin: 5px 0 0;
    font-size: 18.5px;
    line-height: 1.34;
    font-weight: 800;
    letter-spacing: -.035em;
    color: var(--ink);
  }
  .meta {
    margin: 6px 0 0;
    font-size: 12.5px;
    color: var(--accent);
    letter-spacing: -.01em;
    font-variant-numeric: tabular-nums;
    display: flex; flex-wrap: wrap; gap: 0 6px;
  }
  .meta .sep { color: var(--line-strong); }
  .restrictline { margin: 7px 0 0; }
  .restrict {
    display: inline-block;
    font-size: 11px;
    font-weight: 600;
    color: var(--ink);
    border: 1px solid var(--line-strong);
    border-radius: 4px;
    padding: 0 5px;
    line-height: 1.6;
    letter-spacing: -.01em;
    white-space: nowrap;
  }
  .restrict .rk { color: var(--dim); font-weight: 600; margin-right: 4px; }
  .thumb {
    position: relative;
    flex: none;
    width: 84px; height: 84px;
    border-radius: var(--radius);
    background: var(--thumb-bg);
    overflow: hidden;
  }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .enter-badge {
    position: absolute; top: 5px; right: 5px;
    width: 19px; height: 19px;
    display: flex; align-items: center; justify-content: center;
    border-radius: 50%;
    background: var(--ok); color: #fff;
    font-size: 11px; font-weight: 800; line-height: 1;
    box-shadow: 0 0 0 2px var(--bg);
  }
  .enter-badge[hidden] { display: none; }
  html[data-theme="dark"] .thumb img { filter: brightness(.9) contrast(.98); }

  .how {
    margin: 12px 0 0;
    font-size: 13.5px;
    color: var(--body);
    line-height: 1.6;
    letter-spacing: -.01em;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .how .arrow { color: var(--dim); padding: 0 1px; }

  .cond-toggle {
    margin-top: 12px;
    display: inline-flex; align-items: center; gap: 4px;
    font: inherit; font-size: 12.5px;
    color: var(--dim);
    background: transparent; border: 0; padding: 0;
    cursor: pointer;
    letter-spacing: -.01em;
  }
  .cond-toggle:hover { color: var(--ink); }
  .cond-toggle .plus { font-size: 13px; line-height: 1; color: var(--dim); }
  .cond-toggle:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  .cond-body {
    margin: 8px 0 0;
    font-size: 12.5px;
    color: var(--dim);
    line-height: 1.65;
    padding-left: 10px;
    border-left: 2px solid var(--line-strong);
  }
  .cond-body[hidden] { display: none; }

  .row-foot {
    margin-top: 14px;
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
  }
  .go {
    font-size: 13px;
    font-weight: 700;
    color: var(--ink);
    text-decoration: underline;
    text-underline-offset: 3px;
    text-decoration-thickness: 1px;
    text-decoration-color: var(--line-strong);
    letter-spacing: -.01em;
  }
  .go:hover { text-decoration-color: var(--ink); }
  .go:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  .go .ext { font-size: 11px; color: var(--dim); padding-left: 2px; }

  .enter-wrap { flex: none; display: inline-flex; align-items: center; gap: 8px; }
  .enter-when {
    font-size: 11px; color: var(--dim);
    letter-spacing: -.01em; font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  .enter-when[hidden] { display: none; }
  .done-toggle {
    flex: none;
    display: inline-flex; align-items: center; gap: 5px;
    font: inherit; font-size: 12px; font-weight: 600;
    color: var(--dim);
    background: transparent;
    border: 1px solid var(--line-strong);
    border-radius: 999px;
    padding: 3px 10px;
    cursor: pointer;
    letter-spacing: -.01em;
    white-space: nowrap;
    transition: color .12s, background .12s, border-color .12s;
  }
  .done-toggle:hover { color: var(--ink); border-color: var(--ink); }
  .done-toggle .dot {
    width: 11px; height: 11px; border-radius: 50%;
    border: 1.5px solid currentColor;
    display: inline-block;
    flex: none;
  }
  .done-toggle .chk { display: none; font-size: 11px; line-height: 1; }
  .done-toggle[aria-pressed="true"] {
    color: var(--ok);
    background: var(--ok-soft);
    border-color: var(--ok-line);
  }
  .done-toggle[aria-pressed="true"] .dot { display: none; }
  .done-toggle[aria-pressed="true"] .chk { display: inline; }
  .done-toggle:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  .row-foot .go { min-width: 0; }

  /* ---------- states ---------- */
  .empty {
    margin: 44px 0;
    text-align: center;
    color: var(--dim);
    font-size: 13.5px;
  }
  .skeleton { height: 132px; border-bottom: 1px solid var(--line); }
  .skeleton::after {
    content: ""; display: block; height: 84px; margin-top: 22px;
    border-radius: var(--radius);
    background: linear-gradient(90deg, var(--bg-soft), var(--chip), var(--bg-soft));
    background-size: 200% 100%;
    animation: sk 1.2s linear infinite;
  }
  @keyframes sk { to { background-position: -200% 0; } }
  @media (prefers-reduced-motion: reduce) {
    .skeleton::after { animation: none; }
    .chip, .title, .tab { transition: none; }
  }

  footer {
    margin-top: 34px;
    padding: 18px 0 44px;
    border-top: 1px solid var(--line);
    color: var(--dim);
    font-size: 11.5px;
    line-height: 1.7;
  }
  footer p { margin: 3px 0; }
  footer b { color: var(--body); font-weight: 600; }
</style>
</head>
<body>

<header class="site-head">
  <div class="wrap">
    <div class="bar">
      <img class="avatar" src="./images/avatar.png" alt="무료응모 헌터 캐릭터" width="46" height="46">
      <div class="brand-text">
        <h1>무료응모 헌터</h1>
        <p class="tagline">무료응모 · AI 콘테스트 · 지원금 한곳에</p>
      </div>
      <button id="themeBtn" class="theme-btn" type="button" aria-label="다크 모드로 전환" title="다크 모드로 전환">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21 12.8A8.5 8.5 0 1 1 11.2 3a6.6 6.6 0 0 0 9.8 9.8z"/>
        </svg>
      </button>
    </div>
    <nav class="tabs" role="tablist" aria-label="보기 전환">
      <button class="tab" type="button" role="tab" id="tabEvents" data-tab="events" aria-selected="true" aria-controls="panel">
        <span class="t-ico" aria-hidden="true">🎯</span><span class="t-label">무료응모</span><span class="t-c" id="countEvents">–</span>
      </button>
      <button class="tab" type="button" role="tab" id="tabContests" data-tab="contests" aria-selected="false" aria-controls="panel">
        <span class="t-ico" aria-hidden="true">🤖</span><span class="t-label">AI 콘테스트</span><span class="t-c" id="countContests">–</span>
      </button>
      <button class="tab" type="button" role="tab" id="tabBenefits" data-tab="benefits" aria-selected="false" aria-controls="panel" title="지원금·AI혜택">
        <span class="t-ico" aria-hidden="true">💰</span><span class="t-label">지원금·AI혜택</span><span class="t-c" id="countBenefits">–</span>
      </button>
    </nav>
  </div>
</header>

<div class="toolbar">
  <div class="wrap">
    <label class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
        <circle cx="11" cy="11" r="7"/><path d="m16.5 16.5 4 4"/>
      </svg>
      <input id="q" type="search" placeholder="브랜드·경품 검색 (갤럭시, 상품권, 사전예약)" autocomplete="off" aria-label="검색">
    </label>

    <!-- 무료응모 필터 -->
    <div class="prizerow" id="prizeRow" role="group" aria-label="경품별 분류"></div>
    <div class="chiprow" id="catRow" role="group" aria-label="참여 방식·조건 필터">
      <button class="chip" type="button" id="enteredOnly" aria-pressed="false"
        title="내가 응모 완료로 체크한 응모만 모아 봅니다">✅ 내가 응모한 것 <span class="pz-c" id="enteredCount">0</span></button>
      <button class="chip" type="button" id="hideDone" aria-pressed="false"
        title="이미 응모한 항목은 숨깁니다">미응모만</button>
      <span class="sortsep" aria-hidden="true"></span>
      <button class="chip" type="button" data-cat="all" aria-pressed="true"
        title="참여처 제한 없이 모두 보기">방식 전체</button>
      <button class="chip" type="button" data-cat="insta" aria-pressed="false">인스타</button>
      <button class="chip" type="button" data-cat="official" aria-pressed="false">공식몰·폼</button>
      <button class="chip" type="button" data-cat="prereg" aria-pressed="false">사전예약</button>
      <button class="chip" type="button" id="anyOnly" aria-pressed="false"
        title="지역·나이·특정 대상 제한이 있는 응모는 숨깁니다">누구나 가능</button>
    </div>

    <!-- AI 콘테스트 필터 -->
    <div class="chiprow" id="contestRow" role="group" aria-label="AI 콘테스트 분야·조건 필터" hidden>
      <button class="chip" type="button" id="contestsChecked" aria-pressed="false"

    } catch (e) { return fallback; }
  }
  function writeJSON(key, value) {

  }

  /* ---------- date ---------- */
  function todayKST() {
    var now = new Date();
    var kst = new Date(now.getTime() + (9 * 60 + now.getTimezoneOffset()) * 60000);
    return new Date(kst.getFullYear(), kst.getMonth(), kst.getDate());
  }
  function parseDate(s) {
    if (!s || !/^\d{4}-\d{2}-\d{2}$/.test(s)) return null;
    var p = s.split("-");
    return new Date(+p[0], +p[1] - 1, +p[2]);
  }
  function daysLeft(ev) {
    var d = parseDate(ev.deadline);
    if (!d) return null;
    return Math.round((d - todayKST()) / 86400000);
  }
  function deadlineLabel(ev) {
    var d = parseDate(ev.deadline);
    if (!d) return "상시";
    var y = d.getFullYear() !== todayKST().getFullYear() ? d.getFullYear() + "년 " : "";
    return y + (d.getMonth() + 1) + "월 " + d.getDate() + "일 마감";
  }
  /* 자격 제한이 실제로 있는지: '누구나'·'제한 없음'은 제한 없음으로 본다 */
  function hasRestriction(ev) {
    return !!ev.restriction && !/누구나|제한\s*없음/.test(ev.restriction);
  }
  function ddayLabel(ev) {
    var n = daysLeft(ev);
    if (n === null) return null;
    if (n < 0) return "마감";
    if (n === 0) return "D-DAY";
    return "D-" + n;
  }
  /* 참여처: 데이터의 channel 우선, 없으면 카테고리 기본값 */

    return ev.channel || CHAN_BY_CAT[ev.category] || "";
  }
  function kindLabel(ev) {

  }
  function stampLabel(label) {

  }
  function whenLabel(iso, word) {

  }

  /* ---------- 경품 분류 ---------- */
  /* title(대표 경품명)에서 먼저 나오는 경품 종류를 쓴다. 없으면 value_note → conditions → 기타 */
  function firstPrizeInText(text) {
    if (!text) return null;
    var best = null, bestPos = Infinity;
    for (var i = 0; i < PRIZE_ORDER.length; i++) {
      var rx = PRIZE_RX[PRIZE_ORDER[i]];
      if (!rx) continue;
      var m = text.match(rx);
      if (m && m.index < bestPos) { bestPos = m.index; best = PRIZE_ORDER[i]; }
    }
    return best;
  }
  function inferPrize(ev) {
    return firstPrizeInText(String(ev.title || "").toLowerCase())

      || firstPrizeInText(String(ev.conditions || "").toLowerCase())

  function prizeOf(ev) {
    var c = String(ev.prize_category || "").toLowerCase().trim();

    return inferPrize(ev);

  function isChecked(kind, ev) {

  function matches(kind, ev) {
    var c = cfg(kind);
    if (kind === "events") {
      if (!categoryMatch(ev)) return false;
      if (!(state.events.prize === "all" || prizeOf(ev) === state.events.prize)) return false;
    } else if (kind === "contests") {
      if (!(c.st.field === "all" || fieldOf(ev) === c.st.field)) return false;
    } else {
      if (!(c.st.cat === "all" || bcatOf(ev) === c.st.cat)) return false;
    }
    var q = state.q[kind];
    if (q) {
      var hay = [ev.brand, ev.title, ev.event_name, ev.channel, ev.value_note, ev.prize_note,
        ev.summary, ev.conditions, ev.category, ev.field, ev.benefit_category, ev.restriction]
        .join(" ").toLowerCase();
      var ok = q.toLowerCase().split(/\s+/).filter(Boolean).every(function (t) { return hay.indexOf(t) !== -1; });
      if (!ok) return false;
    }
    if (c.st.anyOnly && hasRestriction(ev)) return false;
    var on = kind === "events" ? c.st.enteredOnly : c.st.checkedOnly;
    if (on && !isChecked(kind, ev)) return false;
    if (c.st.hideDone && isChecked(kind, ev)) return false;
    return true;
  }
  function liveEvents(kind) {
    return state.data[kind].filter(function (ev) {
      var d = daysLeft(ev);
      return !(d !== null && d < 0);
    });
  }
  function checkedLiveCount(kind) {
    return liveEvents(kind).filter(function (ev) { return isChecked(kind, ev); }).length;
  }
  function visibleEvents(kind) {
    var list = liveEvents(kind).filter(function (ev) { return matches(kind, ev); });
    list.sort(function (a, b) {
      if (cfg(kind).st.sort === "new") {
        return String(b.start || b.verified_at || "").localeCompare(String(a.start || a.verified_at || ""));
      }
      var da = daysLeft(a), db = daysLeft(b);
      var ka = da === null ? 9999 : da, kb = db === null ? 9999 : db;
      if (ka !== kb) return ka - kb;
      return String(a.brand).localeCompare(String(b.brand));
    });
    return list;
  }
  /* 칩 개수: 마감 전 + 검색어 + 다른 필터 기준(자기 칩은 제외) */
  function chipCounts(kind) {
    var counts = { all: 0 };
    var keys = kind === "events" ? PRIZE_ORDER : kind === "contests" ? ["dev", "creative", "idea"] : ["subsidy", "tax", "ai", "life"];
    keys.forEach(function (k) { counts[k] = 0; });
    var c = cfg(kind);
    var saved = kind === "events" ? c.st.prize : kind === "contests" ? c.st.field : c.st.cat;
    var savedQ = state.q[kind];
    liveEvents(kind).forEach(function (ev) {
      if (kind === "events") c.st.prize = "all";
      else if (kind === "contests") c.st.field = "all";
      else c.st.cat = "all";
      state.q[kind] = savedQ;
      if (!matches(kind, ev)) return;
      counts.all++;
      var k = kind === "events" ? prizeOf(ev) : kind === "contests" ? fieldOf(ev) : bcatOf(ev);
      counts[k] = (counts[k] || 0) + 1;
    });
    if (kind === "events") c.st.prize = saved;
    else if (kind === "contests") c.st.field = saved;
    else c.st.cat = saved;
    return counts;
  }

  /* ---------- render ---------- */
  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }

  function metaLine(kind, ev) {
    var p = el("p", "meta");
    var parts;
    if (kind === "events") {
      parts = [kindLabel(ev), deadlineLabel(ev)];
    } else if (kind === "contests") {
      parts = [FIELD_PLAIN[fieldOf(ev)], deadlineLabel(ev)];
    } else {
      parts = [BCAT_PLAIN[bcatOf(ev)], deadlineLabel(ev)];
    }
    var dd = ddayLabel(ev);
    if (dd) parts.push(dd);
    parts.forEach(function (t, i) {
      if (i) p.appendChild(el("span", "sep", "·"));
      p.appendChild(el("span", null, t));
    });
    return p;
  }

  function restrictionLine(ev) {
    if (!ev.restriction) return null;
    var p = el("p", "restrictline");
    var tag = el("span", "restrict");
    tag.setAttribute("data-restriction", ev.restriction);
    tag.title = "참여 조건: " + ev.restriction;
    tag.appendChild(el("span", "rk", /^누구나/.test(ev.restriction) ? "조건" : "대상"));
    tag.appendChild(el("span", "rv", ev.restriction));
    p.appendChild(tag);
    return p;
  }

  function row(kind, ev) {
    var c = cfg(kind);
    var checkedIso = (kind === "events" ? state.entered[ev.id] : state.checked[kind][ev.id]) || "";
    var isDone = !!checkedIso;
    var art = el("article", "row" + (isDone ? " entered" : ""));
    art.setAttribute("data-id", ev.id);
    art.setAttribute("data-kind", kind);
    if (kind === "events") art.setAttribute("data-prize", prizeOf(ev));
    if (kind === "contests") art.setAttribute("data-field", fieldOf(ev));
    if (kind === "benefits") art.setAttribute("data-bcat", bcatOf(ev));

    var top = el("div", "row-top");
    var text = el("div", "row-text");

    var brandline = el("div", "brandline");
    if (ev.icon) {
      var icon = document.createElement("img");
      icon.className = "favicon";
      icon.src = ev.icon;
      icon.alt = "";
      icon.width = 14; icon.height = 14;
      icon.loading = "eager";
      brandline.appendChild(icon);
    }
    brandline.appendChild(el("span", "brand", ev.brand));
    var chan = channelLabel(ev);
    if (chan) {
      var chanEl = el("span", "chan", chan);
      chanEl.title = "참여처: " + chan;
      brandline.appendChild(chanEl);
    }
    text.appendChild(brandline);

    text.appendChild(el("h3", "title", ev.title));
    text.appendChild(metaLine(kind, ev));
    var restriction = restrictionLine(ev);
    if (restriction) text.appendChild(restriction);
    top.appendChild(text);

    var thumb = el("div", "thumb");
    var im = document.createElement("img");
    im.src = ev.image;
    im.alt = ev.brand + " " + ev.title + " 이미지";
    im.width = 84; im.height = 84;
    im.loading = "eager";
    im.decoding = "async";
    thumb.appendChild(im);
    var badge = el("span", "enter-badge", "✓");
    badge.setAttribute("aria-hidden", "true");
    badge.title = c.countLabel + (isDone ? " · " + whenLabel(checkedIso, c.checkWord) : "");
    badge.hidden = !isDone;
    thumb.appendChild(badge);
    top.appendChild(thumb);
    art.appendChild(top);

    art.appendChild(el("p", "how", ev.summary));

    var condOpen = !!state.open[kind + ":" + ev.id];
    var condLabel = c.cond || "상세 조건";
    var condBtn = el("button", "cond-toggle");
    condBtn.type = "button";
    condBtn.setAttribute("aria-expanded", String(condOpen));
    condBtn.innerHTML = condLabel + ' <span class="plus" aria-hidden="true">' + (condOpen ? "−" : "+") + "</span>";
    var condBody = el("p", "cond-body", ev.conditions || "");
    condBody.hidden = !condOpen;
    condBody.id = "cond-" + kind + "-" + ev.id;
    condBtn.setAttribute("aria-controls", condBody.id);
    condBtn.addEventListener("click", function () {
      var open = condBtn.getAttribute("aria-expanded") === "true";
      state.open[kind + ":" + ev.id] = !open;
      condBtn.setAttribute("aria-expanded", String(!open));
      condBtn.innerHTML = condLabel + ' <span class="plus" aria-hidden="true">' + (open ? "+" : "−") + "</span>";
      condBody.hidden = open;
    });
    art.appendChild(condBtn);
    art.appendChild(condBody);

    var foot = el("div", "row-foot");
    var go = el("a", "go", c.go);
    go.href = ev.url;
    go.target = "_blank";
    go.rel = "noopener noreferrer";
    go.setAttribute("aria-label", ev.title + " " + c.go);
    var ext = el("span", "ext", "↗");
    ext.setAttribute("aria-hidden", "true");
    go.appendChild(ext);
    foot.appendChild(go);

    var wrap = el("div", "enter-wrap");
    var when = el("span", "enter-when", isDone ? whenLabel(checkedIso, c.checkWord) : "");
    when.hidden = !isDone;
    wrap.appendChild(when);

    var doneBtn = el("button", "done-toggle");
    doneBtn.type = "button";
    doneBtn.setAttribute("aria-pressed", String(isDone));
    var labelOff = kind === "events" ? "응모 체크" : kind === "contests" ? "지원 체크" : "확인 체크";
    var labelOn = kind === "events" ? "응모 완료" : kind === "contests" ? "지원 완료" : "확인함";
    var ariaOn = kind === "events" ? " 응모 완료 취소" : kind === "contests" ? " 지원 완료 취소" : " 확인 완료 취소";
    var ariaOff = kind === "events" ? " 응모 완료로 체크" : kind === "contests" ? " 지원 완료로 체크" : " 확인 완료로 체크";
    doneBtn.setAttribute("aria-label", ev.title + (isDone ? ariaOn : ariaOff));
    if (isDone) doneBtn.title = whenLabel(checkedIso, c.checkWord) + " · 누르면 취소";
    doneBtn.appendChild(el("span", "dot"));
    doneBtn.querySelector(".dot").setAttribute("aria-hidden", "true");
    doneBtn.appendChild(el("span", "chk", "✓"));
    doneBtn.querySelector(".chk").setAttribute("aria-hidden", "true");
    doneBtn.appendChild(el("span", "dt-label", isDone ? labelOn : labelOff));
    doneBtn.addEventListener("click", function () {
      var next = doneBtn.getAttribute("aria-pressed") !== "true";
      var store = kind === "events" ? state.entered : state.checked[kind];
      if (next) store[ev.id] = new Date().toISOString();
      else delete store[ev.id];
      writeJSON(kind === "events" ? LS_ENTERED : kind === "contests" ? LS_CONTEST_CHECKED : LS_BENEFIT_CHECKED, store);
      doneBtn.setAttribute("aria-pressed", String(next));
      doneBtn.setAttribute("aria-label", ev.title + (next ? ariaOn : ariaOff));
      doneBtn.querySelector(".dt-label").textContent = next ? labelOn : labelOff;
      art.classList.toggle("entered", next);
      badge.hidden = !next;
      when.hidden = !next;
      when.textContent = next ? whenLabel(store[ev.id], c.checkWord) : "";
      if (next) doneBtn.title = whenLabel(store[ev.id], c.checkWord) + " · 누르면 취소";
      else doneBtn.removeAttribute("title");
      syncChips();
      var hideOn = c.st.hideDone;
      var onlyOn = kind === "events" ? c.st.enteredOnly : c.st.checkedOnly;
      if ((next && hideOn) || (!next && onlyOn)) render();
    });
    wrap.appendChild(doneBtn);
    foot.appendChild(wrap);
    art.appendChild(foot);

    return art;
  }

  function render() {
    var kind = state.tab;
    var c = cfg(kind);
    var host = document.getElementById("list");
    host.textContent = "";
    document.getElementById("countNow").textContent = "(–)";
    document.getElementById("listTitle").textContent = c.live;
    document.getElementById("updated").textContent = stampLabel(state.updated[kind] || "") || "– 확인";
    var emptyEl = document.getElementById("empty");
    var errorEl = document.getElementById("error");

    if (state.failed[kind]) {
      emptyEl.hidden = true;
      errorEl.hidden = false;
      syncChips();
      return;
    }
    if (!state.loaded[kind]) {
      for (var s = 0; s < 4; s++) host.appendChild(el("div", "skeleton"));
      emptyEl.hidden = true;
      errorEl.hidden = true;
      syncChips();
      return;
    }
    errorEl.hidden = true;

    var list = visibleEvents(kind);
    var frag = document.createDocumentFragment();
    list.forEach(function (ev) { frag.appendChild(row(kind, ev)); });
    host.appendChild(frag);

    document.getElementById("countNow").textContent = "(" + list.length + ")";
    var onlyOn = kind === "events" ? state.events.enteredOnly : c.st.checkedOnly;
    document.getElementById("listTitle").textContent = onlyOn ? c.mine : c.live;

    if (list.length) {
      emptyEl.hidden = true;
    } else {
      var msg;
      if (!state.loaded[kind]) msg = "불러오는 중입니다…";
      else if (onlyOn && checkedLiveCount(kind) === 0) msg = c.emptyMine;
      else if (onlyOn) msg = c.emptyMineFiltered;
      else if (c.st.hideDone) msg = c.emptyHide;
      else msg = c.empty;
      emptyEl.textContent = msg;
      emptyEl.hidden = false;
    }
    syncChips();
  }

  /* ---------- chips ---------- */
  function buildPrizeChips() {
    var host = document.getElementById("prizeRow");
    if (!host) return;
    host.textContent = "";
    PRIZE.forEach(function (p) {
      var b = el("button", "chip pz");
      b.type = "button";
      b.setAttribute("data-prize", p.key);
      b.setAttribute("aria-pressed", String(state.events.prize === p.key));
      if (p.icon) {
        var ic = el("span", "pz-ico", p.icon);
        ic.setAttribute("aria-hidden", "true");
        b.appendChild(ic);
      }
      b.appendChild(el("span", "pz-label", p.label));
      b.appendChild(el("span", "pz-c", "–"));
      b.addEventListener("click", function () { setPrize(p.key); });
      host.appendChild(b);
    });
  }

  function syncChips() {
    var kind = state.tab;
    var counts = state.loaded[kind] ? chipCounts(kind) : null;

    [].forEach.call(document.querySelectorAll("#prizeRow .chip[data-prize]"), function (b) {
      b.setAttribute("aria-pressed", String(b.dataset.prize === state.events.prize));
      var c = b.querySelector(".pz-c");
      if (c) c.textContent = (kind === "events" && counts) ? String(counts[b.dataset.prize] || 0) : "–";
    });
    [].forEach.call(document.querySelectorAll("#catRow .chip[data-cat]"), function (b) {
      b.setAttribute("aria-pressed", String(b.dataset.cat === state.events.cat));
    });
    [].forEach.call(document.querySelectorAll("#contestRow .chip[data-field]"), function (b) {
      b.setAttribute("aria-pressed", String(b.dataset.field === state.contests.field));
    });
    [].forEach.call(document.querySelectorAll("#benefitRow .chip[data-bcat]"), function (b) {
      b.setAttribute("aria-pressed", String(b.dataset.bcat === state.benefits.cat));
    });
    [].forEach.call(document.querySelectorAll(".sortrow .chip[data-sort]"), function (b) {
      b.setAttribute("aria-pressed", String(b.dataset.sort === cfg(kind).st.sort));
    });
    document.getElementById("anyOnly").setAttribute("aria-pressed", String(state.events.anyOnly));
    document.getElementById("enteredOnly").setAttribute("aria-pressed", String(state.events.enteredOnly));
    document.getElementById("hideDone").setAttribute("aria-pressed", String(state.events.hideDone));
    document.getElementById("contestsAnyOnly").setAttribute("aria-pressed", String(state.contests.anyOnly));
    document.getElementById("contestsChecked").setAttribute("aria-pressed", String(state.contests.checkedOnly));
    document.getElementById("contestsHideDone").setAttribute("aria-pressed", String(state.contests.hideDone));
    document.getElementById("benefitsAnyOnly").setAttribute("aria-pressed", String(state.benefits.anyOnly));
    document.getElementById("benefitsChecked").setAttribute("aria-pressed", String(state.benefits.checkedOnly));
    document.getElementById("benefitsHideDone").setAttribute("aria-pressed", String(state.benefits.hideDone));

    document.getElementById("enteredCount").textContent = state.loaded.events ? String(checkedLiveCount("events")) : "–";
    document.getElementById("contestsCheckedCount").textContent = state.loaded.contests ? String(checkedLiveCount("contests")) : "–";
    document.getElementById("benefitsCheckedCount").textContent = state.loaded.benefits ? String(checkedLiveCount("benefits")) : "–";

    document.getElementById("countEvents").textContent = state.loaded.events ? String(liveEvents("events").length) : "–";
    document.getElementById("countContests").textContent = state.loaded.contests ? String(liveEvents("contests").length) : "–";
    document.getElementById("countBenefits").textContent = state.loaded.benefits ? String(liveEvents("benefits").length) : "–";

    document.getElementById("countDone").textContent = state.loaded[kind] ? String(checkedLiveCount(kind)) : "0";
    document.getElementById("footCountLabel").textContent = cfg(kind).countLabel;
  }

  /* ---------- controls ---------- */
  function setPrize(key) {
    if (key !== "all" && PRIZE_ORDER.indexOf(key) === -1) key = "all";
    state.events.prize = key;
    writeJSON(LS_PRIZE, key);
    render();
  }
  function setCat(cat) {
    state.events.cat = cat;
    writeJSON(LS_CAT, cat);
    render();
  }
  function setSort(sort) {
    cfg(state.tab).st.sort = sort;
    var key = state.tab === "events" ? LS_SORT : state.tab === "contests" ? LS_C_SORT : LS_B_SORT;
    writeJSON(key, sort);
    render();
  }
  function setHideDone(on) {
    var st = cfg(state.tab).st;
    st.hideDone = on;
    if (on) {
      if (state.tab === "events") st.enteredOnly = false;
      else st.checkedOnly = false;
    }
    writeJSON(state.tab === "events" ? LS_HIDE : state.tab === "contests" ? LS_C_HIDE : LS_B_HIDE, on);
    render();
  }
  function setAnyOnly(on) {
    var st = cfg(state.tab).st;
    st.anyOnly = on;
    writeJSON(state.tab === "events" ? LS_ANY : state.tab === "contests" ? LS_C_ANY : LS_B_ANY, on);
    render();
  }
  function setCheckedOnly(on) {
    var st = cfg(state.tab).st;
    if (state.tab === "events") {
      st.enteredOnly = on;
      if (on && st.hideDone) { st.hideDone = false; writeJSON(LS_HIDE, false); }
    } else {
      st.checkedOnly = on;
      if (on && st.hideDone) { st.hideDone = false; writeJSON(state.tab === "contests" ? LS_C_HIDE : LS_B_HIDE, false); }
    }
    render();
  }
  function setField(key) {
    if (key !== "all" && !FIELD_LABEL[key]) key = "all";
    state.contests.field = key;
    writeJSON(LS_C_FIELD, key);
    render();
  }
  function setBenefitCat(key) {
    if (key !== "all" && !BCAT_LABEL[key]) key = "all";
    state.benefits.cat = key;
    writeJSON(LS_B_CAT, key);
    render();
  }

  /* ---------- tabs ---------- */
  function setTab(tab, push) {
    if (!state.data[tab]) tab = "events";
    state.tab = tab;
    try { localStorage.setItem(LS_TAB, tab); } catch (e) {}
    if (push !== false) {
      try { history.replaceState(null, "", "#" + tab); } catch (e) {}
    }
    [].forEach.call(document.querySelectorAll(".tab"), function (b) {
      b.setAttribute("aria-selected", String(b.dataset.tab === tab));
      b.tabIndex = b.dataset.tab === tab ? 0 : -1;
    });
    document.getElementById("panel").setAttribute("aria-labelledby", "tab" + tab.charAt(0).toUpperCase() + tab.slice(1));
    document.getElementById("prizeRow").hidden = tab !== "events";
    document.getElementById("catRow").hidden = tab !== "events";
    document.getElementById("contestRow").hidden = tab !== "contests";
    document.getElementById("benefitRow").hidden = tab !== "benefits";
    document.getElementById("q").placeholder = cfg(tab).search;
    document.getElementById("q").value = state.q[tab];
    document.getElementById("footNote").textContent = cfg(tab).note;
    document.getElementById("list").setAttribute("aria-label", cfg(tab).live);
    render();
  }

  function applyTheme(theme) {
    document.documentElement.setAttribute("data-theme", theme);
    var btn = document.getElementById("themeBtn");
    var dark = theme === "dark";
    btn.setAttribute("aria-label", dark ? "라이트 모드로 전환" : "다크 모드로 전환");
    btn.title = btn.getAttribute("aria-label");
    btn.innerHTML = dark
      ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.6v2.2M12 19.2v2.2M2.6 12h2.2M19.2 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M18.7 5.3l-1.6 1.6M6.9 17.1l-1.6 1.6"/></svg>'
      : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A8.5 8.5 0 1 1 11.2 3a6.6 6.6 0 0 0 9.8 9.8z"/></svg>';
  }
  function initTheme() {
    var saved = null;
    try { saved = localStorage.getItem(LS_THEME); } catch (e) {}
    var prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
    applyTheme(saved || (prefersDark ? "dark" : "light"));
  }

  function bind() {
    document.getElementById("q").addEventListener("input", function (e) {
      state.q[state.tab] = e.target.value.trim();
      render();
    });
    [].forEach.call(document.querySelectorAll(".tab"), function (b) {
      b.addEventListener("click", function () { setTab(b.dataset.tab); });
    });
    [].forEach.call(document.querySelectorAll("#catRow .chip[data-cat]"), function (b) {
      b.addEventListener("click", function () { setCat(b.dataset.cat); });
    });
    [].forEach.call(document.querySelectorAll("#contestRow .chip[data-field]"), function (b) {
      b.addEventListener("click", function () { setField(b.dataset.field); });
    });
    [].forEach.call(document.querySelectorAll("#benefitRow .chip[data-bcat]"), function (b) {
      b.addEventListener("click", function () { setBenefitCat(b.dataset.bcat); });
    });
    [].forEach.call(document.querySelectorAll(".sortrow .chip[data-sort]"), function (b) {
      b.addEventListener("click", function () { setSort(b.dataset.sort); });
    });
    document.getElementById("hideDone").addEventListener("click", function () { setHideDone(!state.events.hideDone); });
    document.getElementById("enteredOnly").addEventListener("click", function () { setCheckedOnly(!state.events.enteredOnly); });
    document.getElementById("anyOnly").addEventListener("click", function () { setAnyOnly(!state.events.anyOnly); });
    document.getElementById("contestsHideDone").addEventListener("click", function () { setHideDone(!state.contests.hideDone); });
    document.getElementById("contestsChecked").addEventListener("click", function () { setCheckedOnly(!state.contests.checkedOnly); });
    document.getElementById("contestsAnyOnly").addEventListener("click", function () { setAnyOnly(!state.contests.anyOnly); });
    document.getElementById("benefitsHideDone").addEventListener("click", function () { setHideDone(!state.benefits.hideDone); });
    document.getElementById("benefitsChecked").addEventListener("click", function () { setCheckedOnly(!state.benefits.checkedOnly); });
    document.getElementById("benefitsAnyOnly").addEventListener("click", function () { setAnyOnly(!state.benefits.anyOnly); });
    document.getElementById("themeBtn").addEventListener("click", function () {
      var next = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
      applyTheme(next);
      try { localStorage.setItem(LS_THEME, next); } catch (e) {}
    });
    window.addEventListener("hashchange", function () {
      var h = (location.hash || "").replace("#", "");
      if (state.data[h] && h !== state.tab) setTab(h, false);
    });
  }

  /* ---------- boot ---------- */
  function loadEntered() {
    var out = {};
    var cur = readJSON(LS_ENTERED, null);
    if (cur && typeof cur === "object" && !Array.isArray(cur)) {
      Object.keys(cur).forEach(function (k) {
        var v = cur[k];
        if (typeof v === "string" && v) out[k] = v;
        else if (v) out[k] = new Date().toISOString();
      });
      return out;
    }
    var old = readJSON(LS_ENTERED_OLD, null);
    if (old && typeof old === "object" && !Array.isArray(old)) {
      var now = new Date().toISOString();
      Object.keys(old).forEach(function (k) { if (old[k]) out[k] = now; });
      if (Object.keys(out).length) writeJSON(LS_ENTERED, out);
      try { localStorage.removeItem(LS_ENTERED_OLD); } catch (e) {}
    }
    return out;
  }
  function loadChecks(key) {
    var v = readJSON(key, {});
    var out = {};
    if (v && typeof v === "object" && !Array.isArray(v)) {
      Object.keys(v).forEach(function (k) {
        if (typeof v[k] === "string" && v[k]) out[k] = v[k];
        else if (v[k]) out[k] = new Date().toISOString();
      });
    }
    return out;
  }

  function boot() {
    initTheme();
    state.entered = loadEntered();
    state.checked.contests = loadChecks(LS_CONTEST_CHECKED);
    state.checked.benefits = loadChecks(LS_BENEFIT_CHECKED);

    state.events.cat = readJSON(LS_CAT, "all") || "all";
    state.events.sort = readJSON(LS_SORT, "deadline") || "deadline";
    state.events.hideDone = !!readJSON(LS_HIDE, false);
    state.events.anyOnly = !!readJSON(LS_ANY, false);
    var savedPrize = readJSON(LS_PRIZE, "all");
    state.events.prize = (savedPrize === "all" || PRIZE_ORDER.indexOf(savedPrize) !== -1) ? savedPrize : "all";

    var cf = readJSON(LS_C_FIELD, "all");
    state.contests.field = FIELD_LABEL[cf] ? cf : "all";
    state.contests.sort = readJSON(LS_C_SORT, "deadline") === "new" ? "new" : "deadline";
    state.contests.anyOnly = !!readJSON(LS_C_ANY, false);
    state.contests.hideDone = !!readJSON(LS_C_HIDE, false);
    var bc = readJSON(LS_B_CAT, "all");
    state.benefits.cat = BCAT_LABEL[bc] ? bc : "all";
    state.benefits.sort = readJSON(LS_B_SORT, "deadline") === "new" ? "new" : "deadline";
    state.benefits.anyOnly = !!readJSON(LS_B_ANY, false);
    state.benefits.hideDone = !!readJSON(LS_B_HIDE, false);

    buildPrizeChips();
    bind();

    var initial = "events";
    var hash = (location.hash || "").replace("#", "");
    if (["events", "contests", "benefits"].indexOf(hash) !== -1) initial = hash;
    else {
      var savedTab = null;
      try { savedTab = localStorage.getItem(LS_TAB); } catch (e) {}
      if (["events", "contests", "benefits"].indexOf(savedTab) !== -1) initial = savedTab;
    }
    state.tab = initial;
    setTab(initial, false);

    var files = [
      { kind: "events", url: "./data/events.json", key: "events" },
      { kind: "contests", url: "./data/contests.json", key: "contests" },
      { kind: "benefits", url: "./data/benefits.json", key: "benefits" }
    ];
    files.forEach(function (f) {
      fetch(f.url, { cache: "no-cache" })
        .then(function (r) {
          if (!r.ok) throw new Error("HTTP " + r.status);
          return r.json();
        })
        .then(function (data) {
          state.data[f.kind] = (data[f.key] || []).slice();
          state.loaded[f.kind] = true;
          state.updated[f.kind] = data.updated_label || "";
          if (state.tab === f.kind) render();
          else syncChips();
        })
        .catch(function (err) {
          state.failed[f.kind] = true;
          if (state.tab === f.kind) {
            document.getElementById("list").textContent = "";
            document.getElementById("error").hidden = false;
            document.getElementById("empty").hidden = true;
          }
          if (window.console) console.error(f.url + " load failed:", err);
        });
    });
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", boot);
  } else {
    boot();
  }
})();
</script>
</body>
</html>
